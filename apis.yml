aid: ltk
name: LTK
description: >-
  LTK (formerly rewardStyle / LIKEtoKNOW.it) is a creator commerce platform that
  connects shoppers, content creators, and brands, driving more than $6B in
  annual sales. Founded in 2011 by Amber and Baxter Box and headquartered in
  Dallas, LTK operates a shoppable-content network spanning 44M+ monthly
  shoppers, 1M+ brands, and 8,000+ integrated retailers, and has generated
  nearly 1,100 creator millionaires. For brand and affiliate partners, LTK
  exposes a partner API through the rewardStyle Developer Portal at
  api.rewardstyle.com, secured with OAuth2 and gated behind partner
  registration. This profile enriches the LTK company record with its
  verifiable public developer, security, and identity surface.
